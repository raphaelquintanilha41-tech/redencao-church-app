<!doctype html>
<html lang="pt-PT" class="rc-splashing">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000818" />
    <meta name="description" content="Redenção Church — palavra, comunhão e propósito, num só lugar." />
    <title>Redenção Church</title>
    <link rel="preload" as="image" href="/splash-logo.webp" type="image/webp" />
    <!-- Ecrã de abertura (index.html + src/lib/splash.ts): o logo aparece com o
         versículo por baixo (~2 s) e, quando a app está pronta, avança e salta
         para fora do ecrã (zoom no leão, ~2 s) até à Home.
         Só escala e opacidade — nada de máscaras ou filtros; uma única imagem. -->
    <style>
      /* Fundo escuro só enquanto a abertura está no ecrã. A classe é retirada no
         início do salto (splash.ts): depois disso o fundo da página volta a ser o
         do tema (claro/escuro) em toda a altura, mesmo em capítulos longos. */
      html, body { margin: 0; }
      html.rc-splashing, html.rc-splashing body { background: #000818; }
      #rc-splash {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 9999;
        overflow: hidden;
        background: #000818;
        will-change: opacity;
      }
      .rc-splash-glow {
        position: absolute;
        left: 50%; top: 46%;
        width: 150vw; max-width: 720px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(214, 180, 115, 0.16) 0%, rgba(214, 180, 115, 0.06) 36%, rgba(214, 180, 115, 0) 66%);
        opacity: 0;
        animation: rc-fade 1.2s ease-out 0s forwards;
      }
      .rc-splash-stage {
        position: absolute;
        left: 50%; top: 46%;
        width: min(86vw, 360px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%) scale(0.96);
        transform-origin: 47% 43%;
        opacity: 0;
        will-change: transform, opacity;
        backface-visibility: hidden;
        animation: rc-in 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.05s forwards;
      }
      .rc-splash-logo {
        display: block;
        width: 100%;
        height: 100%;
      }
      .rc-splash-verse {
        position: absolute;
        left: 28px; right: 28px; top: 66%;
        margin: 0;
        text-align: center;
        color: #ead9b6;
        font: italic 400 18px/1.5 "Cormorant Garamond", Georgia, "Times New Roman", "Noto Serif", serif;
        opacity: 0;
        animation: rc-fade 0.7s ease-out 0.35s forwards;
      }
      .rc-splash-verse small {
        display: block;
        margin-top: 12px;
        color: #d6b473;
        font: 500 11px/1 Arial, Helvetica, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      /* O salto para fora do ecrã: disparado por splash.ts quando a app está pronta. */
      #rc-splash.rc-splash-leap .rc-splash-stage {
        animation: rc-leap 1.9s cubic-bezier(0.5, 0, 0.75, 0.2) forwards;
      }
      #rc-splash.rc-splash-leap .rc-splash-verse { animation: rc-out 0.5s ease-out forwards; }
      /* No fim do salto a abertura inteira dissolve-se sobre a Home (sem corte seco). */
      #rc-splash.rc-splash-leap { animation: rc-out 0.6s ease-in-out 1.3s forwards; pointer-events: none; }
      @keyframes rc-in {
        to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }
      @keyframes rc-leap {
        from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(5.5); }
      }
      @keyframes rc-fade { to { opacity: 1; } }
      @keyframes rc-out { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .rc-splash-stage, .rc-splash-glow, .rc-splash-verse { animation: none; opacity: 1; }
        .rc-splash-stage { transform: translate(-50%, -50%); }
        #rc-splash.rc-splash-leap .rc-splash-stage { animation: none; }
        #rc-splash.rc-splash-leap { animation-delay: 0s; }
      }
    </style>
  </head>
  <body>
    <div id="rc-splash" role="status" aria-label="A abrir a aplicação Redenção Church">
      <div class="rc-splash-glow" aria-hidden="true"></div>
      <div class="rc-splash-stage" aria-hidden="true">
        <img class="rc-splash-logo" src="/splash-logo.webp" alt="" width="900" height="900" decoding="sync" fetchpriority="high" />
      </div>
      <p class="rc-splash-verse">
        “Eu sou o caminho, a verdade e a vida.”
        <small>João 14 · 6</small>
      </p>
    </div>
    <script>
      // Segurança: se algo falhar no arranque, o ecrã de abertura não fica preso.
      setTimeout(function () {
        var s = document.getElementById('rc-splash');
        if (s) s.remove();
        document.documentElement.classList.remove('rc-splashing');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#0A1120');
      }, 14000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
