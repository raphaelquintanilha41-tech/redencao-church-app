<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1120" />
    <meta name="description" content="Redenção Church — palavra, comunhão e propósito, num só lugar." />
    <title>Redenção Church</title>
    <link rel="preload" as="image" href="/splash-logo.webp" type="image/webp" />
    <!-- Ecrã de abertura: aparece antes de o JavaScript carregar e é retirado
         por src/lib/splash.ts quando a sessão (e a Home) estiverem prontas. -->
    <style>
      /* Fundo escuro desde o primeiro pixel, igual ao ecrã do sistema do PWA. */
      html, body { margin: 0; background: #0a1120; }
      #rc-splash {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: #0a1120;
        opacity: 1;
        transition: opacity 0.45s ease-out;
      }
      #rc-splash.rc-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      /* Só opacidade: nada de escala, máscara, sombra ou filtro — nenhum
         efeito que obrigue a redesenhar a imagem durante o carregamento. */
      .rc-splash-logo {
        display: block;
        width: min(72vw, 340px);
        height: auto;
        opacity: 0;
        animation: rc-splash-fade 0.7s ease-out 0.05s forwards;
      }
      .rc-splash-verse {
        margin: 0;
        max-width: 300px;
        color: #d6b473;
        font: 600 16px/1.45 Arial, Helvetica, sans-serif;
        letter-spacing: 0.02em;
        text-align: center;
        opacity: 0;
        animation: rc-splash-fade 0.7s ease-out 0.45s forwards;
      }
      .rc-splash-verse small {
        display: block;
        margin-top: 4px;
        color: #8e9ab2;
        font-size: 14px;
        font-weight: 500;
      }
      .rc-splash-bar {
        position: relative;
        width: 140px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(214, 180, 115, 0.18);
        opacity: 0;
        animation: rc-splash-fade 0.7s ease-out 0.7s forwards;
      }
      .rc-splash-bar::after {
        content: '';
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #d6b473, transparent);
        animation: rc-splash-slide 1.4s ease-in-out infinite;
      }
      @keyframes rc-splash-fade {
        to { opacity: 1; }
      }
      @keyframes rc-splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rc-splash-logo, .rc-splash-verse, .rc-splash-bar { animation: none; opacity: 1; }
        .rc-splash-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="rc-splash" role="status" aria-label="A abrir a aplicação Redenção Church">
      <img class="rc-splash-logo" src="/splash-logo.webp" alt="" width="480" height="480" decoding="sync" fetchpriority="high" />
      <p class="rc-splash-verse">
        “Eu sou o caminho, a verdade e a vida.”
        <small>João 14:6</small>
      </p>
      <div class="rc-splash-bar" aria-hidden="true"></div>
    </div>
    <script>
      // Segurança: se algo falhar no arranque, o ecrã de abertura não fica preso.
      setTimeout(function () {
        var s = document.getElementById('rc-splash');
        if (s) s.remove();
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
