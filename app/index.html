<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1120" />
    <meta name="description" content="Redenção Church — palavra, comunhão e propósito, num só lugar." />
    <title>Redenção Church</title>
    <link rel="preload" as="image" href="/splash-logo.webp" type="image/webp" />
    <!-- Ecrã de abertura: aparece antes de o JavaScript carregar e é retirado
         por src/lib/splash.ts quando a sessão (e a Home) estiverem prontas. -->
    <style>
      /* Fundo escuro desde o primeiro pixel: evita a faixa branca nas margens
         antes de o CSS da app carregar e liga sem corte ao ecrã do sistema. */
      html, body { margin: 0; background: #0a1120; }
      #rc-splash {
        position: fixed;
        inset: -1px; /* cobre arredondamentos de subpixel nas bordas */
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: #0a1120 radial-gradient(circle at 50% 42%, #0d1d3d 0%, #071329 48%, #0a1120 100%);
        opacity: 1;
        transition: opacity 0.45s ease-out;
        will-change: opacity;
        contain: strict;
      }
      #rc-splash.rc-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      .rc-splash-logo {
        position: relative;
        width: min(72vw, 340px);
        aspect-ratio: 1;
        background: url('/splash-logo.webp') center / contain no-repeat;
        -webkit-mask-image: radial-gradient(circle, #000 58%, transparent 71%);
        mask-image: radial-gradient(circle, #000 58%, transparent 71%);
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.92);
        will-change: transform, opacity;
        backface-visibility: hidden;
        /* só transform/opacity (compositor) — sem filtros nem sombras animadas */
        animation: rc-splash-in 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) 0s forwards,
          rc-splash-breathe 4.8s ease-in-out 0.8s infinite;
      }
      .rc-splash-verse {
        margin: 0;
        max-width: 300px;
        color: #d6b473;
        font: 600 16px/1.45 Arial, Helvetica, sans-serif;
        letter-spacing: 0.02em;
        text-align: center;
        opacity: 0;
        will-change: opacity;
        animation: rc-splash-fade 0.8s ease-out 0.5s forwards;
      }
      .rc-splash-verse small {
        display: block;
        margin-top: 4px;
        color: #8e9ab2;
        font-size: 14px;
        font-weight: 500;
      }
      .rc-splash-bar {
        position: relative;
        width: 140px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(214, 180, 115, 0.18);
        transform: translate3d(0, 0, 0);
      }
      .rc-splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #d6b473, transparent);
        will-change: transform;
        animation: rc-splash-slide 1.3s ease-in-out infinite;
      }
      @keyframes rc-splash-in {
        from { opacity: 0; transform: translate3d(0, 0, 0) scale(0.92); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes rc-splash-breathe {
        0%, 100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        50% { opacity: 1; transform: translate3d(0, 0, 0) scale(1.03); }
      }
      @keyframes rc-splash-fade {
        to { opacity: 1; }
      }
      @keyframes rc-splash-slide {
        from { transform: translate3d(-100%, 0, 0); }
        to { transform: translate3d(250%, 0, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rc-splash-logo, .rc-splash-verse { animation: none; opacity: 1; transform: none; }
        .rc-splash-bar::after { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="rc-splash" role="status" aria-label="A abrir a aplicação Redenção Church">
      <div class="rc-splash-logo" aria-hidden="true"></div>
      <p class="rc-splash-verse">
        “Eu sou o caminho, a verdade e a vida.”
        <small>João 14:6</small>
      </p>
      <div class="rc-splash-bar" aria-hidden="true"></div>
    </div>
    <script>
      // Segurança: se algo falhar no arranque, o ecrã de abertura não fica preso.
      setTimeout(function () {
        var s = document.getElementById('rc-splash');
        if (s) s.remove();
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
