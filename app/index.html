<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1120" />
    <meta name="description" content="Redenção Church — palavra, comunhão e propósito, num só lugar." />
    <title>Redenção Church</title>
    <link rel="preload" as="image" href="/splash-logo.webp" type="image/webp" />
    <!-- Ecrã de abertura: aparece antes de o JavaScript carregar e é retirado
         por src/lib/splash.ts quando a sessão (e a Home) estiverem prontas. -->
    <style>
      /* Abertura "Revelação": fundo igual ao do logo, uma linha dourada que se
         desenha, o logo que sobe suavemente e o versículo. Só opacidade e um
         deslize curto — nada de máscaras, filtros ou sombras animadas. */
      html, body { margin: 0; background: #000818; }
      #rc-splash {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) 28px env(safe-area-inset-bottom);
        background: #000818;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #rc-splash.rc-splash-hide { opacity: 0; pointer-events: none; }
      .rc-splash-glow {
        position: absolute;
        left: 50%; top: 46%;
        width: 150vw; max-width: 720px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(214, 180, 115, 0.13) 0%, rgba(214, 180, 115, 0.05) 36%, rgba(214, 180, 115, 0) 66%);
        opacity: 0;
        animation: rc-fade 2.2s ease-out 0.3s forwards;
      }
      .rc-splash-line {
        position: relative;
        width: 0;
        height: 1px;
        margin-bottom: -6px;
        background: linear-gradient(90deg, rgba(214, 180, 115, 0), #d6b473, rgba(214, 180, 115, 0));
        animation: rc-line 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s forwards;
      }
      .rc-splash-logo {
        position: relative;
        display: block;
        width: min(84vw, 380px);
        height: auto;
        opacity: 0;
        transform: translateY(18px);
        animation: rc-rise 1.3s cubic-bezier(0.2, 0.7, 0.2, 1) 0.7s forwards;
      }
      .rc-splash-verse {
        position: relative;
        margin: -4px 0 0;
        max-width: 300px;
        text-align: center;
        color: #ead9b6;
        font: italic 400 18px/1.5 "Cormorant Garamond", Georgia, "Times New Roman", "Noto Serif", serif;
        opacity: 0;
        animation: rc-fade 1s ease-out 1.6s forwards;
      }
      .rc-splash-verse small {
        display: block;
        margin-top: 12px;
        color: #d6b473;
        font: 500 11px/1 Arial, Helvetica, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      @keyframes rc-fade { to { opacity: 1; } }
      @keyframes rc-line { to { width: min(64vw, 260px); } }
      @keyframes rc-rise { to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .rc-splash-glow, .rc-splash-logo, .rc-splash-verse { animation: none; opacity: 1; transform: none; }
        .rc-splash-line { animation: none; width: min(64vw, 260px); }
      }
    </style>
  </head>
  <body>
    <div id="rc-splash" role="status" aria-label="A abrir a aplicação Redenção Church">
      <div class="rc-splash-glow" aria-hidden="true"></div>
      <div class="rc-splash-line" aria-hidden="true"></div>
      <img class="rc-splash-logo" src="/splash-logo.webp" alt="" width="900" height="900" decoding="sync" fetchpriority="high" />
      <p class="rc-splash-verse">
        “Eu sou o caminho, a verdade e a vida.”
        <small>João 14 · 6</small>
      </p>
    </div>
    <script>
      // Segurança: se algo falhar no arranque, o ecrã de abertura não fica preso.
      setTimeout(function () {
        var s = document.getElementById('rc-splash');
        if (s) s.remove();
      }, 12000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
