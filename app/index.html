<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1120" />
    <meta name="description" content="Redenção Church — palavra, comunhão e propósito, num só lugar." />
    <title>Redenção Church</title>
    <link rel="preload" as="image" href="/splash-pieces.webp" type="image/webp" />
    <!-- Ecrã de abertura (index.html + src/lib/splash.ts): o logo forma-se a
         partir de 8 fragmentos, assenta, mostra o versículo e, quando a app está
         pronta, o leão "salta" ao encontro da pessoa (zoom) e dissolve para a Home.
         Só deslocamento, escala e opacidade — nada de máscaras ou filtros.
         Nas aberturas seguintes do mesmo dia corre a versão curta (html.rc-short). -->
    <script>
      (function () {
        try {
          var k = 'rc-splash-day', d = new Date().toISOString().slice(0, 10);
          if (localStorage.getItem(k) === d) document.documentElement.className += ' rc-short';
          localStorage.setItem(k, d);
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background: #000818; }
      #rc-splash {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 9999;
        overflow: hidden;
        background: #000818;
        opacity: 1;
      }
      .rc-splash-glow {
        position: absolute;
        left: 50%; top: 46%;
        width: 150vw; max-width: 720px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(214, 180, 115, 0.14) 0%, rgba(214, 180, 115, 0.05) 36%, rgba(214, 180, 115, 0) 66%);
        opacity: 0;
        animation: rc-fade 2s ease-out 0.5s forwards;
      }
      .rc-splash-stage {
        position: absolute;
        left: 50%; top: 46%;
        width: min(86vw, 360px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%) scale(0.94);
        animation: rc-settle 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 1.55s forwards;
      }
      .rc-piece {
        position: absolute;
        inset: 0;
        background-image: url('/splash-pieces.webp');
        background-size: 400% 200%;
        background-repeat: no-repeat;
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.55);
        animation: rc-join 1.3s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .rc-p0 { background-position: 0.0000% 0%; --dx: 65px; --dy: -157px; animation-delay: 0.25s; }
      .rc-p1 { background-position: 33.3333% 0%; --dx: 157px; --dy: -65px; animation-delay: 0.34s; }
      .rc-p2 { background-position: 66.6667% 0%; --dx: 157px; --dy: 65px; animation-delay: 0.43s; }
      .rc-p3 { background-position: 100.0000% 0%; --dx: 65px; --dy: 157px; animation-delay: 0.52s; }
      .rc-p4 { background-position: 0.0000% 100%; --dx: -65px; --dy: 157px; animation-delay: 0.61s; }
      .rc-p5 { background-position: 33.3333% 100%; --dx: -157px; --dy: 65px; animation-delay: 0.70s; }
      .rc-p6 { background-position: 66.6667% 100%; --dx: -157px; --dy: -65px; animation-delay: 0.79s; }
      .rc-p7 { background-position: 100.0000% 100%; --dx: -65px; --dy: -157px; animation-delay: 0.88s; }
      .rc-splash-verse {
        position: absolute;
        left: 28px; right: 28px; top: 66%;
        margin: 0;
        text-align: center;
        color: #ead9b6;
        font: italic 400 18px/1.5 "Cormorant Garamond", Georgia, "Times New Roman", "Noto Serif", serif;
        opacity: 0;
        animation: rc-fade 0.9s ease-out 2.5s forwards;
      }
      .rc-splash-verse small {
        display: block;
        margin-top: 12px;
        color: #d6b473;
        font: 500 11px/1 Arial, Helvetica, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .rc-splash-veil {
        position: absolute;
        inset: 0;
        background: #000818;
        opacity: 0;
        pointer-events: none;
      }
      /* O salto: disparado por splash.ts quando a app está pronta (classe rc-splash-leap). */
      #rc-splash.rc-splash-leap .rc-splash-stage {
        animation: rc-leap 1.1s cubic-bezier(0.55, 0, 0.85, 0.35) forwards;
      }
      #rc-splash.rc-splash-leap .rc-splash-verse { animation: rc-out 0.45s ease-out forwards; }
      #rc-splash.rc-splash-leap .rc-splash-veil { animation: rc-fade 0.5s ease-in 0.65s forwards; }
      /* Versão curta (aberturas seguintes no mesmo dia): logo já formado. */
      html.rc-short .rc-piece { animation: none; opacity: 1; transform: none; }
      html.rc-short .rc-splash-stage { animation: none; transform: translate(-50%, -50%); }
      html.rc-short .rc-splash-glow { animation-delay: 0s; animation-duration: 0.6s; }
      html.rc-short .rc-splash-verse { animation-delay: 0.1s; animation-duration: 0.5s; }
      html.rc-short #rc-splash.rc-splash-leap .rc-splash-stage { animation: rc-leap 1.1s cubic-bezier(0.55, 0, 0.85, 0.35) forwards; }
      @keyframes rc-join { to { opacity: 1; transform: translate(0, 0) scale(1); } }
      @keyframes rc-settle {
        0% { transform: translate(-50%, -50%) scale(0.94); }
        60% { transform: translate(-50%, -50%) scale(1.03); }
        100% { transform: translate(-50%, -50%) scale(1); }
      }
      @keyframes rc-leap {
        from { transform: translate(-50%, -50%) scale(1); }
        to { transform: translate(-50%, -50%) scale(4.2); }
      }
      @keyframes rc-fade { to { opacity: 1; } }
      @keyframes rc-out { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .rc-piece, .rc-splash-glow, .rc-splash-verse { animation: none; opacity: 1; transform: none; }
        .rc-splash-stage { animation: none; transform: translate(-50%, -50%); }
        #rc-splash.rc-splash-leap .rc-splash-stage { animation: none; }
        #rc-splash.rc-splash-leap .rc-splash-veil { animation-delay: 0s; }
      }
    </style>
  </head>
  <body>
    <div id="rc-splash" role="status" aria-label="A abrir a aplicação Redenção Church">
      <div class="rc-splash-glow" aria-hidden="true"></div>
      <div class="rc-splash-stage" style="transform-origin: 47% 43%;" aria-hidden="true">
        <div class="rc-piece rc-p0"></div>
        <div class="rc-piece rc-p1"></div>
        <div class="rc-piece rc-p2"></div>
        <div class="rc-piece rc-p3"></div>
        <div class="rc-piece rc-p4"></div>
        <div class="rc-piece rc-p5"></div>
        <div class="rc-piece rc-p6"></div>
        <div class="rc-piece rc-p7"></div>
      </div>
      <p class="rc-splash-verse">
        “Eu sou o caminho, a verdade e a vida.”
        <small>João 14 · 6</small>
      </p>
      <div class="rc-splash-veil" aria-hidden="true"></div>
    </div>
    <script>
      // Segurança: se algo falhar no arranque, o ecrã de abertura não fica preso.
      setTimeout(function () {
        var s = document.getElementById('rc-splash');
        if (s) s.remove();
      }, 14000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
